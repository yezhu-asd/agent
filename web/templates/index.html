<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 校园医务室 - 智能问诊预约系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #f1f5f9 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.08), 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .header {
            background: #ffffff;
            padding: 20px 30px;
            color: #0f172a;
            position: relative;
            border-bottom: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.06) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0d9488;
        }

        .header-subtitle {
            font-size: 14px;
            color: #64748b;
        }
        
        .nav-bar {
            background: rgba(255,255,255,0.98);
            padding: 15px 30px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        
        .nav-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #475569;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-btn:hover {
            border-color: #10b981;
            color: #0d9488;
            background: #f0fdf4;
            transform: translateY(-1px);
        }
        
        .chat-content {
            flex: 1;
            padding: 20px 30px;
            overflow-y: auto;
            background: #f8fafc;
            scroll-behavior: smooth;
        }

        .chat-content::-webkit-scrollbar {
            width: 6px;
        }

        .chat-content::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.04);
            border-radius: 3px;
        }

        .chat-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        
        .message { 
            display: flex; 
            margin-bottom: 20px; 
            align-items: flex-end;
            animation: messageSlide 0.3s ease;
        }
        
        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user { 
            flex-direction: row-reverse; 
        }
        
        .avatar { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 16px;
            font-weight: 600;
            margin: 0 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .message.user .avatar {
            background: #10b981;
            color: white;
        }

        .message.bot .avatar {
            background: #e5f5ee;
            color: #0d9488;
        }
        
        .bubble { 
            max-width: 75%; 
            padding: 15px 20px; 
            border-radius: 20px; 
            font-size: 15px;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .message.user .bubble {
            background: #10b981;
            color: white;
            border-bottom-right-radius: 5px;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
        }

        .message.bot .bubble {
            background: #f8fafc;
            color: #334155;
            border-bottom-left-radius: 5px;
            border: 1px solid #e2e8f0;
            font-weight: 400;
        }
        
        /* 机器人回复中的特殊文本样式 */
        .bot-reply {
            color: #334155;
            font-weight: 500;
        }

        .bot-thought {
            color: #94a3b8;
            font-style: italic;
            font-size: 14px;
            opacity: 0.8;
        }

        .bot-success {
            color: #0d9488;
            font-weight: 600;
            background: #f0fdf4;
            padding: 10px 15px;
            border-radius: 10px;
            margin: 5px 0;
            border-left: 4px solid #10b981;
        }

        .bot-error {
            color: #dc2626;
            font-weight: 600;
            background: #fef2f2;
            padding: 10px 15px;
            border-radius: 10px;
            margin: 5px 0;
            border-left: 4px solid #ef4444;
        }

        .bot-info {
            color: #0369a1;
            font-weight: 600;
            background: #f0f9ff;
            padding: 10px 15px;
            border-radius: 10px;
            margin: 5px 0;
            border-left: 4px solid #38bdf8;
        }
        
        .input-area {
            padding: 20px 30px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
        }
        
        #chat-form { 
            display: flex; 
            gap: 15px;
            align-items: center;
        }
        
        #user-input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            font-size: 15px;
            background: #f8fafc;
            transition: all 0.2s ease;
            outline: none;
            resize: none;
            max-height: 120px;
            overflow-y: auto;
        }

        #user-input:focus {
            border-color: #10b981;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        #user-input::placeholder {
            color: #94a3b8;
            opacity: 1;
        }

        #send-btn {
            padding: 15px 25px;
            border-radius: 12px;
            border: none;
            background: #10b981;
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #send-btn:hover {
            background: #0d9488;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        
        #send-btn:active {
            transform: translateY(0);
        }
        
        .typing-indicator {
            display: none;
            padding: 15px 20px;
            background: white;
            border-radius: 20px;
            margin: 10px 0;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .typing-dots {
            display: inline-flex;
            gap: 4px;
        }
        
        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        /* 机器人快捷按钮 */
        .bot-quick-btn {
            transition: all 0.2s ease;
        }
        .bot-quick-btn:hover {
            background: #10b981 !important;
            color: white !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .bot-quick-btn:active {
            transform: translateY(0);
        }

        /* 风险警告条样式 */
        .risk-alert {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8c42 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin: 15px 30px;
            border-left: 5px solid #ff3333;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
            animation: slideIn 0.3s ease-out;
        }
        
        .risk-alert.high-risk {
            background: linear-gradient(135deg, #d63031 0%, #e84393 100%);
            border-left-color: #ae2012;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .risk-icon {
            font-size: 24px;
            flex-shrink: 0;
        }
        
        .risk-text {
            font-weight: 500;
            flex: 1;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .risk-close {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
            transition: background 0.3s ease;
        }
        
        .risk-close:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* 风险弹窗操作按钮 */
        .risk-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            margin-left: auto;
        }

        .risk-btn {
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .risk-btn-call {
            background: #ff3333;
            color: white;
            box-shadow: 0 2px 8px rgba(255, 51, 51, 0.4);
        }

        .risk-btn-call:hover {
            background: #cc0000;
            transform: translateY(-1px);
        }

        .risk-btn-ack {
            background: rgba(255, 255, 255, 0.9);
            color: #d63031;
        }

        .risk-btn-ack:hover {
            background: white;
            transform: translateY(-1px);
        }

        .risk-alert.high-risk {
            animation: slideIn 0.3s ease-out, riskPulse 1.5s ease-in-out infinite;
        }

        @keyframes riskPulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(214, 48, 49, 0.3); }
            50% { box-shadow: 0 4px 25px rgba(214, 48, 49, 0.7); }
        }

        /* 紧急模式常驻横幅 */
        .emergency-banner {
            background: linear-gradient(135deg, #ae2012 0%, #d63031 100%);
            color: white;
            padding: 10px 20px;
            margin: 10px 30px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .emergency-banner.show {
            display: block;
        }

        /* 聊天中的紧急提示块 */
        .bot-emergency {
            background: #fff5f5;
            border: 2px solid #d63031;
            border-left: 5px solid #ae2012;
            color: #ae2012;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            line-height: 1.6;
            margin: 6px 0;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-10px); opacity: 1; }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 15px;
            }
            
            .header, .nav-bar, .chat-content, .input-area {
                padding-left: 20px;
                padding-right: 20px;
            }
            
            .nav-bar {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 20px;
            }
            
            .bubble {
                max-width: 85%;
            }
            
            .header-title {
                font-size: 20px;
            }
            
            .header-subtitle {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- 头部区域 -->
        <div class="header">
            <div class="header-title">
                <i class="fas fa-robot"></i>
                智能预约助手
            </div>
            <div class="header-subtitle">
                AI驱动的校园医务室问诊系统 - 为您提供便捷智能的医学咨询和预约服务
            </div>
        </div>
        
        <!-- 导航栏 -->
        <div class="nav-bar">
            <button class="nav-btn" onclick="window.location.href='/technician'">
                <i class="fas fa-users"></i>
                医生状态
            </button>
            <button class="nav-btn" onclick="window.location.href='/technician_schedule'">
                <i class="fas fa-calendar-alt"></i>
                医生值班
            </button>
            <button class="nav-btn" id="clear-btn">
                <i class="fas fa-trash-alt"></i>
                清空对话
            </button>
        </div>
        
        <!-- 风险警告条 -->
        <div class="risk-alert" id="riskAlert" style="display: none;">
            <span class="risk-icon">⚠️</span>
            <span class="risk-text" id="riskText">您描述的症状存在风险，建议立即就医或拨打校医室咨询电话</span>
            <div class="risk-actions">
                <button class="risk-btn risk-btn-call" onclick="callEmergency()">
                    📞 拨打 120
                </button>
                <button class="risk-btn risk-btn-ack" onclick="acknowledgeRisk()">
                    我已了解，立即就医
                </button>
            </div>
        </div>

        <!-- 紧急模式常驻横幅 -->
        <div class="emergency-banner" id="emergencyBanner">
            🚨 当前处于紧急咨询模式：请立即拨打 120 或前往校医务室，切勿延误！
        </div>
        
        <!-- 聊天内容区域 -->
        <div class="chat-content" id="chat-box">
            <!-- 欢迎消息 -->
            <div class="message bot">
                <div class="avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="bubble">
                    <div class="bot-info">
                        👋 您好！我是智能预约助手，很高兴为您服务！
                    </div>
                    <div class="bot-reply">
                        我可以帮您：<br>
                        • 🕐 预约医生问诊<br>
                        • 👨‍⚕️ 查询医生状态<br>
                        • 📅 安排预约时间<br>
                        • ❓ 解答相关问题
                    </div>
                    <div class="bot-success">
                        请告诉我您需要什么帮助？
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 打字指示器 -->
        <div class="typing-indicator" id="typing-indicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span style="margin-left: 10px; color: #666;">AI正在思考中...</span>
        </div>
        
        <!-- 输入区域 -->
        <div class="input-area">
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="请输入您的问题或需求..." autocomplete="off" required>
                <button id="send-btn" type="submit">
                    <i class="fas fa-paper-plane"></i>
                    发送
                </button>
            </form>
        </div>
    </div>
    <script>
    // 检查登录状态
    function checkAuth() {
        const token = localStorage.getItem('token');
        if (!token) {
            // 未登录，重定向到登录页
            window.location.href = '/login';
            return null;
        }
        return token;
    }

    // 启用/禁用界面
    function setUIEnabled(enabled) {
        document.getElementById('send-btn').disabled = !enabled;
        document.getElementById('user-input').disabled = !enabled;
        document.getElementById('clear-btn').disabled = !enabled;
    }

    // 显示登出按钮
    function showLogoutButton() {
        const header = document.querySelector('.header');
        if (header) {
            const logoutBtn = document.createElement('button');
            logoutBtn.innerHTML = '<i class="fas fa-sign-out-alt"></i> 登出';
            logoutBtn.style.cssText = 'position: absolute; right: 30px; top: 20px; background: #f0fdf4; color: #0d9488; border: 1px solid #10b981; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s;';
            logoutBtn.onmouseover = () => { logoutBtn.style.background = '#10b981'; logoutBtn.style.color = '#ffffff'; };
            logoutBtn.onmouseout = () => { logoutBtn.style.background = '#f0fdf4'; logoutBtn.style.color = '#0d9488'; };
            logoutBtn.onclick = logout;
            header.appendChild(logoutBtn);
        }
    }

    // 登出
    async function logout() {
        const token = localStorage.getItem('token');
        if (!token) return;

        try {
            await fetch('/api/auth/logout', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
        } catch (e) {
            console.log('Logout error:', e);
        }

        localStorage.removeItem('token');
        localStorage.removeItem('conversation_id');
        localStorage.removeItem('user_info');
        window.location.href = '/login';
    }

    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const clearBtn = document.getElementById('clear-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    let lastBotBubble = null;

    function addMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + sender;
        
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        if (sender === 'user') {
            avatar.innerHTML = '<i class="fas fa-user"></i>';
        } else {
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
        }
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = text.replace(/\n/g, '<br>');
        
        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        chatBox.appendChild(msgDiv);
        
        // 平滑滚动到底部
        requestAnimationFrame(() => {
            chatBox.scrollTo({
                top: chatBox.scrollHeight,
                behavior: 'smooth'
            });
        });
        
        if (sender === 'bot') lastBotBubble = bubble;
    }

    function showTypingIndicator() {
        typingIndicator.style.display = 'block';
        requestAnimationFrame(() => {
            chatBox.scrollTo({
                top: chatBox.scrollHeight,
                behavior: 'smooth'
            });
        });
    }

    function hideTypingIndicator() {
        typingIndicator.style.display = 'none';
    }

    function updateLastBotMessage(text) {
        if (lastBotBubble) {
            // 先提取 [BUTTONS] 标记（在渲染 REPLY 之前）
            let buttonsHtml = '';
            const buttonsMatch = text.match(/\[BUTTONS\]([\s\S]*?)(?=\n|$)/);
            if (buttonsMatch) {
                const buttonsText = buttonsMatch[1].trim();
                const buttonLabels = buttonsText.split(',').map(s => s.trim()).filter(Boolean);
                if (buttonLabels.length > 0) {
                    buttonsHtml = '<div class="bot-quick-buttons" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;">'
                        + buttonLabels.map(label =>
                            `<button class="bot-quick-btn" onclick="window.sendQuickReply(this.textContent)" style="padding:8px 16px;border-radius:20px;border:2px solid #10b981;background:white;color:#10b981;font-size:14px;cursor:pointer;transition:all 0.2s;hover {background:#10b981;color:white;}">${label}</button>`
                        ).join('')
                        + '</div>';
                }
            }

            // 用正则分割所有 [THOUGHT]、[REPLY]、[STATE]、[ALERT] 标签及其内容
            const pattern = /(\[THOUGHT[^\]]*\][\s\S]*?)(?=\[THOUGHT|\[REPLY|\[STATE|\[ALERT|$)|(\[REPLY[^\]]*\][\s\S]*?)(?=\[THOUGHT|\[REPLY|\[STATE|\[ALERT|$)|(\[ALERT[^\]]*\][\s\S]*?)(?=\[THOUGHT|\[REPLY|\[STATE|\[ALERT|$)/g;
            let result = [];
            let match;
            while ((match = pattern.exec(text)) !== null) {
                if (match[1]) {
                    // THOUGHT - 思考过程，用淡色显示
                    const thoughtText = match[1].replace(/\[THOUGHT[^\]]*\]/, '').trim().replace(/\n/g, '<br>');
                    result.push(`<div class="bot-thought">${thoughtText}</div>`);
                } else if (match[2]) {
                    // REPLY - 最终回复，使用突出颜色
                    let replyText = match[2].replace(/\[REPLY[^\]]*\]/, '').replace(/\[BUTTONS\][^\n]*\n?/g, '').trim().replace(/\n/g, '<br>');

                    // 检查回复类型并应用不同样式
                    let styledReply = replyText;
                    if (replyText.includes('预约成功') || replyText.includes('已为您预约')) {
                        // 成功消息
                        styledReply = `<div class="bot-success">✅ ${replyText}</div>`;
                    } else if (replyText.includes('抱歉') || replyText.includes('失败') || replyText.includes('不空闲')) {
                        // 错误消息
                        styledReply = `<div class="bot-error">❌ ${replyText}</div>`;
                    } else if (replyText.includes('请问') || replyText.includes('需要')) {
                        // 询问消息
                        styledReply = `<div class="bot-info">💬 ${replyText}</div>`;
                    } else {
                        // 普通回复，使用突出的颜色
                        styledReply = `<div class="bot-reply">${replyText}</div>`;
                    }

                    result.push(styledReply);
                } else if (match[3]) {
                    // ALERT - 紧急提示，红色高亮
                    const alertText = match[3].replace(/\[ALERT[^\]]*\]/, '').trim().replace(/\n/g, '<br>');
                    result.push(`<div class="bot-emergency">🚨 ${alertText}</div>`);
                    // 显示紧急模式横幅
                    showEmergencyBanner();
                }
            }

            // 追加按钮到末尾（只在包含 [BUTTONS] 时）
            if (buttonsHtml) {
                result.push(buttonsHtml);
            }
            lastBotBubble.innerHTML = result.join('');

            // 内容更新后自动滚动
            requestAnimationFrame(() => {
                chatBox.scrollTo({
                    top: chatBox.scrollHeight,
                    behavior: 'smooth'
                });
            });
        }
    }

    // 发送快捷回复（点击机器人消息中的按钮）
    window.sendQuickReply = async function(label) {
        // 直接发送按钮文本作为用户输入（复用原有提交逻辑）
        userInput.value = label;
        chatForm.dispatchEvent(new Event('submit'));
    };

    // 关闭风险警告条
    function closeRiskAlert() {
        const alert = document.getElementById('riskAlert');
        alert.style.display = 'none';
    }

    // 高风险弹窗确认状态
    let highRiskAcknowledged = false;
    let pendingRiskKeyword = null;

    // 拨打 120
    function callEmergency() {
        window.open('tel:120', '_self');
    }

    // 我已了解，立即就医
    function acknowledgeRisk() {
        highRiskAcknowledged = true;
        closeRiskAlert();
        showEmergencyBanner();
        // 若存在未发送的高风险消息，自动补发
        if (pendingRiskKeyword) {
            const msg = `[RISK]${pendingRiskKeyword}`;
            pendingRiskKeyword = null;
            userInput.value = msg;
            chatForm.dispatchEvent(new Event('submit'));
        }
    }

    // 显示紧急模式横幅
    function showEmergencyBanner() {
        document.getElementById('emergencyBanner').classList.add('show');
    }

    // 隐藏紧急模式横幅
    function hideEmergencyBanner() {
        document.getElementById('emergencyBanner').classList.remove('show');
    }

    // 检测风险症状
    function checkRiskSymptoms(text) {
        // 红旗症状关键词
        const highRiskKeywords = [
            '胸痛', '胸闷', '心绞痛', '心梗',
            '呼吸困难', '窒息', '喘不上气',
            '晕厥', '意识不清', '昏迷',
            '严重头痛', '头炸裂', '脑血管',
            '持续高烧', '39度以上', '烧到40度',
            '严重腹痛', '腹部剧痛',
            '持续出血', '大出血',
            '中毒', '中风', '脑梗',
            '过敏', '过敏性休克', '严重过敏',
            '骨折', '严重外伤', '创伤'
        ];
        
        const mediumRiskKeywords = [
            '持续呕吐', '无法进食',
            '意识模糊',
            '严重腹泻',
            '持续头晕',
            '大量出血'
        ];
        
        const lowerText = text.toLowerCase();
        
        // 检查高风险
        for (let keyword of highRiskKeywords) {
            if (lowerText.includes(keyword.toLowerCase())) {
                return { risk: 'high', keyword: keyword };
            }
        }
        
        // 检查中等风险
        for (let keyword of mediumRiskKeywords) {
            if (lowerText.includes(keyword.toLowerCase())) {
                return { risk: 'medium', keyword: keyword };
            }
        }
        
        return { risk: 'none', keyword: null };
    }

    // 显示风险警告
    function showRiskAlert(riskLevel, keyword) {
        const alert = document.getElementById('riskAlert');
        const riskText = document.getElementById('riskText');

        if (riskLevel === 'high') {
            alert.classList.add('high-risk');
            riskText.textContent = `⚠️ 紧急提示：您提到的"${keyword}"属于高风险症状，请立即就医或拨打120急救电话！`;
            pendingRiskKeyword = keyword;
        } else if (riskLevel === 'medium') {
            alert.classList.remove('high-risk');
            riskText.textContent = `⚠️ 风险提示：您提到的"${keyword}"需要尽快就医，建议立即就医或拨打校医室咨询电话`;
        }

        alert.style.display = 'flex';
    }

    chatForm.onsubmit = async function(e) {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text) return;

        // 检测用户输入中的风险症状
        const riskCheck = checkRiskSymptoms(text);
        let isHighRisk = false;
        if (riskCheck.risk !== 'none') {
            showRiskAlert(riskCheck.risk, riskCheck.keyword);
            if (riskCheck.risk === 'high') {
                // 高风险：阻塞发送，等待用户确认就医
                isHighRisk = true;
                if (!highRiskAcknowledged) {
                    pendingRiskKeyword = text;
                    addMessage(text, 'user');
                    userInput.value = '';
                    // 提示用户先确认
                    addMessage('⚠️ 检测到高风险症状，请先点击上方"我已了解，立即就医"或"拨打120"按钮。', 'bot');
                    return;
                }
            }
        } else {
            closeRiskAlert();
        }

        // 获取 token
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
            return;
        }

        // 禁用发送按钮
        const sendBtn = document.getElementById('send-btn');
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 发送中...';

        addMessage(text, 'user');
        userInput.value = '';

        // 显示打字指示器
        showTypingIndicator();
        
        // 添加空的机器人消息
        addMessage('', 'bot');
        lastBotBubble = chatBox.querySelector('.message.bot:last-child .bubble');

        // 判断是否高风险信号（[RISK] 前缀或已确认高风险）
        let riskFlag = 'none';
        if (text.startsWith('[RISK]')) {
            riskFlag = 'high';
        } else if (isHighRisk && highRiskAcknowledged) {
            riskFlag = 'high';
        }

        try {
            const res = await fetch('/chat/stream', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    message: text.replace(/^\[RISK\]/, '').trim(),
                    risk: riskFlag
                })
            });
            
            if (res.status === 401) {
                // Token 失效，重定向到登录
                localStorage.removeItem('token');
                window.location.href = '/login';
                return;
            }
            
            hideTypingIndicator();
            
            const reader = res.body.getReader();
            let botMsg = '';
            let decoder = new TextDecoder();
            
            while (true) {
                const {done, value} = await reader.read();
                if (done) break;
                botMsg += decoder.decode(value, {stream: true});
                updateLastBotMessage(botMsg);
            }
        } catch (error) {
            hideTypingIndicator();
            lastBotBubble.innerHTML = '抱歉，服务暂时不可用，请稍后再试。';
            console.error('Chat error:', error);
        } finally {
            // 恢复发送按钮
            sendBtn.disabled = false;
            sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 发送';
            userInput.focus();
        }
    }

    clearBtn.onclick = function() {
        // 保留欢迎消息，只清除其他对话
        const welcomeMessage = chatBox.querySelector('.message.bot').cloneNode(true);
        chatBox.innerHTML = '';
        chatBox.appendChild(welcomeMessage);
        
        // 重新设置lastBotBubble为null
        lastBotBubble = null;
        
        // 聚焦输入框
        userInput.focus();
    }
    
    // 添加回车键发送功能
    userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            chatForm.dispatchEvent(new Event('submit'));
        }
    });
    
    // 页面加载完成后检查登录状态
    window.addEventListener('load', function() {
        const token = checkAuth();
        if (token) {
            showLogoutButton();
            // 显示用户信息
            const userInfo = localStorage.getItem('user_info');
            if (userInfo) {
                try {
                    const info = JSON.parse(userInfo);
                    const title = document.querySelector('.header h1');
                    if (title) {
                        title.innerHTML = `欢迎，${info.user_name} <span style="font-size: 14px; margin-left: 10px;">(${info.phone})</span>`;
                    }
                } catch (e) {
                    console.log('Parse user info error:', e);
                }
            }
        }
        userInput.focus();
    });
    </script>
</body>
</html>
