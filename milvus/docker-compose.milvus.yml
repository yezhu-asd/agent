# Milvus 本地向量数据库部署
# standalone 单节点
services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=0
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    volumes:
      - ${MILVUS_DATA_DIR:-./milvus_data}/etcd:/etcd
    networks:
      - milvus
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

  minio:
    container_name: milvus-minio
    # 已修复minio迁移quay.io问题
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ${MILVUS_DATA_DIR:-./milvus_data}/minio:/minio_data
    networks:
      - milvus
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.12
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # 提高单次查询最大返回数，确保 BM25 初始化能全量读取知识库文档
      MILVUS_COMMON_MAXIMUM_QUERY_RESULT_WINDOW: 1000000
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 6G
    volumes:
      - ${MILVUS_DATA_DIR:-./milvus_data}/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # 修复：删除错误attu2，使用官方正确zilliz/attu v2.4.8
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.4.8
    ports:
      - "8000:3000"
    environment:
      MILVUS_URL: milvus:19530
    networks:
      - milvus
    depends_on:
      - milvus

networks:
  milvus:
    driver: bridge