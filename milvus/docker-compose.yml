version: '3.5'

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.1
    command: ['milvus', 'run', 'standalone']
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    ports:
      - '19530:19530'
      - '9091:9091'
    depends_on:
      - etcd
      - minio
    # ── 核心：精细控制各组件内存上限（单位 MB）──
    # 16 GB 物理内存下：queryNode 8GB + proxy 1GB + 其他 ~3GB = 12GB 给 Milvus，4GB 给 Windows
    mem_limit: 12g
    environment_extra:
      # 查询节点：向量搜索主要消耗在这里
      QUERY_NODE_MEMORY_LIMIT: 8589934592      # 8 GB
      # 索引节点：建索引时临时使用
      INDEX_NODE_MEMORY_LIMIT: 4294967296      # 4 GB
      # 代理节点：请求转发
      PROXY_MEMORY_LIMIT: 1073741824           # 1 GB
